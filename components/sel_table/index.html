<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0e1117; }
  .wl-wrap { height: 100vh !important; max-height: none !important; margin: 0 !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const root = document.getElementById('root');

function send(type, payload) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, payload), '*');
}

function selectedCodes() {
  const out = [];
  root.querySelectorAll('.stock-checkbox:checked').forEach(cb => {
    const c = cb.dataset.code;
    if (c && !out.includes(c)) out.push(c);
  });
  return out;
}

root.addEventListener('change', e => {
  const t = e.target;
  if (!t || !t.classList) return;
  if (t.classList.contains('header-select-all')) {
    const tbl = t.closest('table');
    if (tbl) tbl.querySelectorAll('.stock-checkbox').forEach(cb => { cb.checked = t.checked; });
    send('streamlit:setComponentValue', { value: selectedCodes(), dataType: 'json' });
  } else if (t.classList.contains('stock-checkbox')) {
    send('streamlit:setComponentValue', { value: selectedCodes(), dataType: 'json' });
  }
});

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.type !== 'streamlit:render') return;
  const a = d.args || {};
  root.innerHTML = a.html || '';
  send('streamlit:setFrameHeight', { height: a.frame_h || 400 });
});

send('streamlit:componentReady', { apiVersion: 1 });
</script>
</body>
</html>
