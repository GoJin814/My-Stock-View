<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0e1117; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const root = document.getElementById('root');

function send(type, payload) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, payload), '*');
}

// 표 높이만큼 iframe 높이를 맞춘다 (내부 스크롤 없이 페이지 전체가 스크롤되도록)
function fitHeight() {
  send('streamlit:setFrameHeight', { height: Math.ceil(document.body.scrollHeight) + 4 });
}

function selectedCodes() {
  const out = [];
  root.querySelectorAll('.stock-checkbox').forEach(cb => {
    if (cb.checked) {
      const c = (cb.dataset.code || '').trim();
      if (c && !out.includes(c)) out.push(c);
    }
  });
  return out;
}

function pushValue() {
  send('streamlit:setComponentValue', { value: selectedCodes(), dataType: 'json' });
}

function toggleAll(headerBox) {
  const tbl = headerBox.closest('table');
  if (tbl) {
    tbl.querySelectorAll('.stock-checkbox').forEach(cb => { cb.checked = headerBox.checked; });
  }
  pushValue();
}

root.addEventListener('change', e => {
  const t = e.target;
  if (!t || !t.classList) return;
  if (t.classList.contains('header-select-all')) {
    toggleAll(t);
  } else if (t.classList.contains('stock-checkbox')) {
    pushValue();
  }
});

root.addEventListener('click', e => {
  const t = e.target;
  if (t && t.classList && t.classList.contains('header-select-all')) {
    setTimeout(() => toggleAll(t), 0);
  }
});

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.type !== 'streamlit:render') return;
  const a = d.args || {};
  root.innerHTML = a.html || '';
  fitHeight();
  setTimeout(fitHeight, 60);
  setTimeout(fitHeight, 300);
});

send('streamlit:componentReady', { apiVersion: 1 });
</script>
</body>
</html>
